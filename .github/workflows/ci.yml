name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    env:
      CONAN_OPTS: -s compiler.cppstd=gnu20 --build=missing

    steps:
      - uses: actions/checkout@v4

      - name: Install Conan
        run: pip install conan

      - name: Pin CMake 3.x
        run: |
          pip install "cmake>=3.27,<4"
          cmake --version

      - name: Detect Conan profile
        run: conan profile detect --force

      # Drogon et ses dépendances sont longs à compiler : on garde le cache
      # Conan d'un run à l'autre, clé basée sur les recettes.
      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          key: conan-${{ runner.os }}-${{ hashFiles('**/conanfile.py') }}
          restore-keys: conan-${{ runner.os }}-

      # Les libs doivent être construites dans l'ordre de leurs dépendances,
      # dans le même job pour partager le cache.
      - name: Build and test devops-core
        working-directory: libs/core
        run: conan create . --version=0.1.0 $CONAN_OPTS

      - name: Build devops-protocol
        working-directory: libs/protocol
        run: conan create . --version=0.1.0 $CONAN_OPTS

      - name: Install backend dependencies
        working-directory: backend
        run: conan install . $CONAN_OPTS

      - name: Build backend
        working-directory: backend
        run: |
          cmake --preset conan-release
          cmake --build --preset conan-release

      - name: Run backend unit tests
        working-directory: backend
        run: ./build/Release/devops-backend-tests